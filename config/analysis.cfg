# Phase 1 local JSON analysis configuration for a single interactive client.
logToStdout = false
logToStderr = true
logAllRequests = false
logAllResponses = false
logErrorsAndWarnings = true
logSearchInfo = false

# Keep the response perspective explicit and stable across turns.
reportAnalysisWinratesAs = BLACK
analysisPVLen = 15
maxVisits = 500
wideRootNoise = 0.0
rootSymmetryPruning = false

numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 8

# The engine was compiled for, and this project targets, exactly 15x15.
maxBoardXSizeForNNBuffer = 15
maxBoardYSizeForNNBuffer = 15
requireMaxBoardSize = true

# 2^18 entries * roughly 1.5 KiB keeps the cache near 384 MiB.
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
nnRandomize = false
