# Stage 2 local analysis configuration for the validated Apple M5 OpenCL path.
logToStdout = false
logToStderr = true
logAllRequests = false
logAllResponses = false
logErrorsAndWarnings = true
logSearchInfo = false

reportAnalysisWinratesAs = BLACK
analysisPVLen = 15
maxVisits = 500
wideRootNoise = 0.0
rootSymmetryPruning = false

numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 8
nnMaxBatchSize = 8

maxBoardXSizeForNNBuffer = 15
maxBoardYSizeForNNBuffer = 15
requireMaxBoardSize = true

nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
nnRandomize = false

# Keep Apple OpenCL autotuning data inside this ignored project artifact tree.
homeDataDir = artifacts/runtime/opencl
