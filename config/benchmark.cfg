# Phase 1 reproducible CPU/Eigen benchmark configuration.
# Gom2024 uses individual Gomoku rule keys rather than Go ruleset names.
basicRule = RENJU
VCNRule = NOVC
firstPassWin = false
maxMoves = 0

defaultBoardSize = 15
maxVisits = 500
numSearchThreads = 8
ponderingEnabled = false

# 2^18 entries * roughly 1.5 KiB keeps the cache near 384 MiB.
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
nnRandomize = false
