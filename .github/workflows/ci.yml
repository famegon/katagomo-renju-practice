name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reject private, generated, or oversized release files
        run: ./scripts/check-release-tree.sh

  unit-and-native-helper:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install native build dependencies
        run: brew install cmake eigen jq
      - name: Install Python dependencies
        run: make venv python-deps
      - name: Run web, server, and official helper tests
        run: make test

  real-engine:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install native build dependencies
        run: brew install cmake eigen jq
      - name: Prepare Python and official KataGomo assets
        run: make venv python-deps engine model forbidden-helper
      - name: Run the real CPU/Eigen integration test
        run: make integration-test
